<style>

.seg.s2{background:none;border:0;padding:0}.seg.s2 button{background:#1B1724;min-height:38px;font-size:13px}.seg.s2 button.on{background:var(--pri);color:#fff}

nav{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);border-radius:28px;padding:5px;background:#15121Cd9;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 30px #000a;justify-content:space-between;gap:0}

select{max-width:100%;min-width:0}

</style></head><body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const K='painel-vida-v1';
let S={habits:[],tasks:[],goals:[],workouts:[],meals:[],water:{},events:[]},tab='home',day=iso(new Date()),dirty=0;
try{const r=localStorage.getItem(K);if(r){try{S=Object.assign(S,JSON.parse(r))}catch(e){localStorage.setItem(K+'-corrompido',r)}}}catch(e){}
function save(){S._ts=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){err('Não foi possível salvar neste aparelho.')}schedPush()}
function iso(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function shift(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
const TODAY=iso(new Date()),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WD=['D','S','T','Q','Q','S','S'];
function vib(){try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}

function streak(h){let n=0,d=TODAY;if(!h.done[d])d=shift(d,-1);while(h.done[d]){n++;d=shift(d,-1)}return n}
function best(h){const k=Object.keys(h.done).sort();let b=0,c=0,p=null;for(const x of k){c=p&&shift(p,1)===x?c+1:1;b=Math.max(b,c);p=x}return b}
function yearTotal(h){return Object.keys(h.done).filter(k=>k.startsWith(TODAY.slice(0,4))).length}

function habitsToday(){
 const doneToday=S.habits.filter(h=>h.done[TODAY]).length,tot=S.habits.length;
 const yr=S.habits.reduce((a,h)=>a+yearTotal(h),0);
 let h=`<h1>Hábitos</h1><div class="sub">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div>
 <div class="row" style="margin:-6px 0 14px"><div class="bar" style="flex:1;height:5px;margin:0"><i style="width:${tot?doneToday/tot*100:0}%"></i></div><span class="sub" style="margin:0;min-width:36px;text-align:right">${tot?Math.round(doneToday/tot*100):0}%</span></div>
 <div class="stat"><div><b>${doneToday}/${tot}</b><span>hoje</span></div><div><b>${hst()[0]}%</b><span>últimos 7 dias</span></div><div><b>${hst()[1]}%</b><span>este mês</span></div></div><div class="sub" style="margin:-4px 2px 12px">${yr} check-ins no ano · maior sequência: ${Math.max(0,...S.habits.map(streak))} dia(s)</div>
 <div class="card row"><input id="hn" placeholder="Novo hábito (ex.: Beber água)" onkeydown="if(event.key=='Enter')addH()"><button onclick="addH()">+</button></div>`;
 if(!tot)h+=emptyH('habits','Nenhum hábito ainda','Crie o primeiro e marque todo dia para acompanhar sua sequência.','Criar hábito',"document.getElementById('hn').focus()");
 for(const x of S.habits){
  const dots=[6,5,4,3,2,1,0].map(i=>{const d=shift(TODAY,-i);return `<button class="dot ${x.done[d]?'on':''}" onclick="tg('${x.id}','${d}')">${WD[new Date(d+'T12:00:00').getDay()]}</button>`}).join('');
  h+=`<div class="card"><div class="row"><button class="chk ${x.done[TODAY]?'on pop':''}" onclick="tg('${x.id}','${TODAY}')">${x.done[TODAY]?'{{check}}':''}</button><div class="t"><b>${esc(x.name)}</b><div class="sub" style="margin:0">${yearTotal(x)}× no ano · {{flame}} ${streak(x)} dias · recorde ${best(x)}</div></div><button class="x" onclick="delH('${x.id}')">{{trash}}</button></div><div class="dots">${dots}</div></div>`}
 return h}
let hv='hoje',hmo=TODAY.slice(0,7),hyr=+TODAY.slice(0,4);
const z2=x=>String(x).padStart(2,'0');
function habits(){const d=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});return '<h1>Hábitos</h1><div class="sub cap">'+d+'</div><div class="v">'+seg2("hv='@'",hv,[['hoje','Hoje'],['mes','Mês'],['ano','Ano']],'s2')+(hv=='mes'?hMes():hv=='ano'?hAno():habitsToday())+'</div>'}
function hmv(n){const [y,m]=hmo.split('-').map(Number),d=new Date(y,m-1+n,1);hmo=d.getFullYear()+'-'+z2(d.getMonth()+1);render()}
function hMes(){
 const [y,m]=hmo.split('-').map(Number),n=new Date(y,m,0).getDate(),days=Array.from({length:n},(_,i)=>i+1);
 const nome=new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
 let h=`<h1>Tabela mensal</h1><div class="row sp card"><button class="g" onclick="hmv(-1)">{{left}}</button><b class="cap">${nome}</b><button class="g" onclick="hmv(1)">{{right}}</button></div>`;
 if(!S.habits.length)return h+'<div class="empty">Crie seus hábitos na aba Hoje.</div>';
 h+=`<div class="card" style="padding:8px"><div id="sc" style="overflow-x:auto"><table class="tb"><tr><th class="fc">Hábito</th>${days.map(d=>`<th>${d}</th>`).join('')}<th style="min-width:70px">Total</th></tr>`;
 for(const x of S.habits){const c=days.filter(d=>x.done[hmo+'-'+z2(d)]).length;
  h+=`<tr><td class="fc">${esc(x.name)}</td>${days.map(d=>{const k=hmo+'-'+z2(d);return `<td><button class="cell ${x.done[k]?'on':''}" onclick="tgm('${x.id}','${k}')"></button></td>`}).join('')}<td><b>${c}</b> <span class="sub">${Math.round(c/n*100)}%</span></td></tr>`}
 return h+'</table></div></div><div class="sub">Toque em uma célula para marcar ou desmarcar aquele dia. Arraste para o lado para ver o mês todo.</div>'}
function tgm(id,d){const e=document.getElementById('sc'),l=e?e.scrollLeft:0,h=S.habits.find(x=>x.id===id);if(h.done[d])delete h.done[d];else h.done[d]=1;vib();save();render();const e2=document.getElementById('sc');if(e2)e2.scrollLeft=l}
function hAno(){
 const M=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
 let h=`<h1>Tabela anual</h1><div class="row sp card"><button class="g" onclick="hyr--;render()">{{left}}</button><b>${hyr}</b><button class="g" onclick="hyr++;render()">{{right}}</button></div>`;
 if(!S.habits.length)return h+'<div class="empty">Crie seus hábitos na aba Hoje.</div>';
 const cnt=(x,i)=>Object.keys(x.done).filter(k=>k.startsWith(hyr+'-'+z2(i+1))).length,dim=i=>new Date(hyr,i+1,0).getDate(),tot=Array(12).fill(0);
 h+=`<div class="card" style="padding:8px"><div style="overflow-x:auto"><table class="tb"><tr><th class="fc">Hábito</th>${M.map(m=>`<th>${m}</th>`).join('')}<th style="min-width:46px">Ano</th></tr>`;
 for(const x of S.habits){let s=0;
  h+=`<tr><td class="fc">${esc(x.name)}</td>${M.map((_,i)=>{const c=cnt(x,i);s+=c;tot[i]+=c;return `<td class="ac" style="${c?'background:rgba(139,92,246,'+(0.2+c/dim(i)*0.8).toFixed(2)+');color:#fff;font-weight:600':'color:var(--mut)'}">${c||'·'}</td>`}).join('')}<td><b>${s}</b></td></tr>`}
 h+=`<tr><td class="fc"><b>Total</b></td>${tot.map(c=>`<td><b>${c}</b></td>`).join('')}<td><b>${tot.reduce((a,b)=>a+b,0)}</b></td></tr>`;
 return h+'</table></div></div><div class="sub">Cada número é quantas vezes você fez o hábito naquele mês. Quanto mais roxo, mais constante.</div>'}
function addH(){if(guard())return;const i=document.getElementById('hn'),v=i.value.trim();if(!v)return err('Digite o nome do hábito.');S.habits.push({id:uid(),name:v,done:{}});save();render();say('Hábito criado')}
function delH(id){if(confirm('Excluir este hábito e todo o histórico?')){S.habits=S.habits.filter(x=>x.id!==id);save();render()}}
S.since=S.since||TODAY;
function allDone(){return S.habits.length>0&&S.habits.every(h=>h.done[TODAY])}
function tg(id,d){const was=allDone(),h=S.habits.find(x=>x.id===id);if(h.done[d])delete h.done[d];else h.done[d]=1;vib();save();render();if(!was&&d===TODAY&&allDone())win()}
function win(){
 if(!S.nosound)try{const c=new(window.AudioContext||window.webkitAudioContext)();[523,659,784].forEach((f,i)=>{const t=c.currentTime+i*.12,o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.5);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.55)})}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([30,40,60])}catch(e){}
 const b=document.createElement('div');b.textContent='Dia completo!';b.style.cssText='position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 24px);transform:translateX(-50%);background:#7650C8;color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;z-index:9;box-shadow:0 8px 30px #7650C8aa;animation:p .6s';document.body.appendChild(b);setTimeout(()=>b.remove(),2200)}
function ds(d){return Math.floor((new Date(TODAY+'T12:00:00')-new Date(d+'T12:00:00'))/864e5)}
function bk(){

  <div class="row" style="gap:6px;flex-wrap:wrap;margin:4px 0 8px">${[25,50,75,100].map(p=>`<span class="chip ${pct>=p?'ok':''}">${pct>=p?'{{check}} ':''}${p}% · ${+(g.start+span*p/100).toFixed(2)}</span>`).join('')}</div><svg viewBox="0 0 300 76" width="100%"><defs><linearGradient id="gr${g.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><line x1="10" x2="290" y1="${ty}" y2="${ty}" stroke="${col}" stroke-dasharray="4 4" opacity=".5"/><polygon points="${area}" fill="url(#gr${g.id})"/><polyline fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" points="${line}"/>${xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${col}"/>`).join('')}</svg>

const SB='https://pcalibndykgrvaaoqqfz.supabase.co',SK='sb_publishable_VoWKdxkKkryEF-LKWWfjkg_K4PAnz_W',SSK='painel-sessao',VK='painel-vinculo',PK='painel-sem-conta';

function setSess(x){sess=x;try{x?localStorage.setItem(SSK,JSON.stringify(x)):localStorage.removeItem(SSK)}catch(e){}}
function mkSess(j){return{access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:{id:j.user.id,email:j.user.email}}}
function errMsg(j,st){const t=String((j&&(j.error_code||j.msg||j.error_description||j.message||j.error))||'');
 if(/invalid_credentials|Invalid login/i.test(t))return 'E-mail ou senha incorretos.';
 if(/user_already_exists|already registered/i.test(t))return 'Este e-mail já tem conta. Toque em Entrar.';
 if(/weak_password|at least/i.test(t))return 'A senha precisa ter ao menos 6 caracteres.';
 if(/email_not_confirmed/i.test(t))return 'Confirme seu e-mail (veja a caixa de entrada) e depois entre.';
 if(/rate_limit|too many/i.test(t))return 'Muitas tentativas. Aguarde um pouco e tente de novo.';
 if(/email_address_invalid|invalid.*email/i.test(t))return 'Confira o e-mail digitado.';
 if(/same_password/i.test(t))return 'Use uma senha diferente da anterior.';
 return 'Não foi possível concluir ('+(st||'erro')+'). Tente de novo.'}
async function authCall(path,body,tok,method){
 let r;try{r=await fetch(SB+path,{method:method||'POST',headers:{apikey:SK,'Content-Type':'application/json',Authorization:'Bearer '+(tok||SK)},body:JSON.stringify(body)})}catch(e){throw new Error('Sem conexão com a internet.')}
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(errMsg(j,r.status));return j}
async function refresh(){
 let r;try{r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SK,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:sess.refresh_token})})}catch(e){throw new Error('net')}

function refreshOnce(){return refP=refP||refresh().finally(()=>{refP=null})}
async function sb(path,opt){
 if(!sess)throw new Error('auth');
 if(sess.expires_at*1000-Date.now()<60000)await refreshOnce();
 for(let t=0;t<2;t++){
  const h=Object.assign({apikey:SK,Authorization:'Bearer '+sess.access_token,'Content-Type':'application/json'},opt&&opt.headers);
  let r;try{r=await fetch(SB+path,Object.assign({},opt,{headers:h}))}catch(e){throw new Error('net')}
